<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/picnic">
</head>
<body>

    {% if doc.status == "Available" %}

    <article class="card" style="margin-bottom: 1.5rem;">
        <div style="padding: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <h5 style="margin: 0;">
                    <a href="/{{ doc.route |e }}">
                        {{ doc.name |e }}
                    </a>
                </h5>

                <span class="label success">
                    {{ doc.status |e }}
                </span>
            </div>

            <div class="flex two" style="margin-top: 1rem;">
                <div>
                    <small style="color: #666;">Airport</small>
                    <p style="margin: 0;">{{ doc.airport |e }}</p>
                </div>

                <div>
                    <small style="color: #666;">Total Area</small>
                    <p style="margin: 0;">{{ doc.area |e }}</p>
                </div>
            </div>
                <a href="/{{ doc.route |e }}"class="button">View Shop</a>
            </div>
            </div>
        </div>
    </article>

    {% endif %}

</body>
</html>
